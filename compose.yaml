services:
  game:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3001
      ALLOWED_ORIGINS: https://${SITE_DOMAIN}
    expose:
      - "3001"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
volumes:
  caddy_data:
  caddy_config:
